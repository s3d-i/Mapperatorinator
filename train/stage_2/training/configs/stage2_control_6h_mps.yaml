# Stage 2 control encoder run sized for local Apple M5 / 24 GB shared memory.
dataset_root: mania-dataset
index_path: train/artifacts/indexes/stage2_control_windows_4k_2to6_dense_local_bpm_norm_unique_le3.parquet
control_v3_timeseries_path: train/artifacts/features/control_v3_timeseries_4k_no_timing_anomalies_2to6.parquet
output_dir: train/artifacts/runs/stage2_control/stage2_control_6h_mps
run_name: stage2_control_6h_mps

max_steps: 12000
eval_every: 1000
save_every: 1000
log_every: 10
batch_size: 12
learning_rate: 0.0002
weight_decay: 0.01
seed: 1337
device: mps

eval_fraction: 0.02
final_train_eval_size: 4096
num_workers: 0
max_cached_maps: 16

model:
  d_model: 192
  heads: 4
  layers: 3
  ffn_dim: 768
  dropout: 0.1
  conv_blocks: 2
  conv_kernel_size: 5

loss:
  confidence_loss_weight: 0.25
  sparse_boost: 4.0
